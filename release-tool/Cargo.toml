[package]
name = "release-tool"
version.workspace = true
edition.workspace = true
publish = false
description = "Outil de la chaîne de release : fabrique et vérifie le manifeste signé (jamais livré, ne voit jamais la clé privée)"

[lints]
workspace = true

[lib]
name = "release_tool"
path = "src/lib.rs"

[[bin]]
name = "release-tool"
path = "src/main.rs"

[dependencies]
proto = { path = "../proto" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
data-encoding = "2"

[dev-dependencies]
tempfile = "3"
