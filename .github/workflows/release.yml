name: release
# Publication : binaires statiques (Linux amd64 et arm64, Windows), SHA256SUMS + attestation de provenance, et images
# Docker multi-architecture sur GHCR. Déclenchée par une étiquette `vX.Y.Z` (qui doit être la version de Cargo.toml).
# `workflow_dispatch` (publish = false) construit tout SANS rien publier : c'est la répétition générale.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier réellement (release GitHub + images GHCR) ; faux = répétition sans publication"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Publier = étiquette poussée, ou lancement manuel AVEC `publish` ET depuis une étiquette (jamais depuis une branche :
  # la release prendrait le nom de la branche).
  PUBLISH: ${{ github.event_name == 'push' || (inputs.publish && github.ref_type == 'tag') }}
  # Les actions Docker déposent sinon un artefact « *.dockerbuild » (journal de construction) qui n'est pas un zip et fait
  # échouer un `download-artifact` sans filtre.
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: L'étiquette doit être la version du workspace
        run: |
          V="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)"
          [ -n "$V" ] || { echo "::error::version introuvable dans Cargo.toml"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::l'étiquette $GITHUB_REF_NAME ne correspond pas à la version $V de Cargo.toml"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          case "$V" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  linux:
    # Par architecture, NATIVEMENT : UNE seule compilation (Dockerfile, étape `build`), dont on tire les binaires statiques
    # puis les deux images (master, agent). Les trois constructions partagent le cache de BuildKit de ce job : les images
    # ne recompilent rien.
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Binaires (compilation unique)
        run: |
          docker buildx build --target artifacts --output type=local,dest=out             --cache-from type=gha,scope=build-${{ matrix.arch }} --cache-to type=gha,scope=build-${{ matrix.arch }},mode=max .
      - name: Les binaires sont STATIQUES (aucune dépendance dynamique)
        run: |
          for b in nxt-master nxt-agent; do
            file "out/$b" | grep -Eq "statically linked|static-pie linked" || { echo "::error::$b n'est pas statique"; exit 1; }
            ! ldd "out/$b" 2>/dev/null | grep -q "=>" || { echo "::error::$b a des dépendances dynamiques"; ldd "out/$b"; exit 1; }
          done
      - name: Les binaires s'exécutent
        run: ./out/nxt-agent --version && ./out/nxt-master --version
      - run: |
          mkdir dist
          cp out/nxt-master "dist/nxt-master-linux-${{ matrix.arch }}"
          cp out/nxt-agent "dist/nxt-agent-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      # Images minimales (scratch, non-root). Les couches de compilation viennent du cache de l'étape précédente.
      - name: Propriétaire en minuscules (GHCR l'exige)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: master
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: master
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
          outputs: type=image,name=ghcr.io/${{ env.OWNER }}/nxt-master,push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH == 'true' }}
      - id: agent
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: agent
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
          outputs: type=image,name=ghcr.io/${{ env.OWNER }}/nxt-agent,push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH == 'true' }}
      - name: Condensats des images
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.master.outputs.digest }}" > "/tmp/digests/master-${{ matrix.arch }}"
          echo "${{ steps.agent.outputs.digest }}" > "/tmp/digests/agent-${{ matrix.arch }}"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - run: cd ui && npm ci && npm run build
      - run: cargo build --release --locked -p master -p agent
      - name: Les binaires s'exécutent
        run: ./target/release/agent.exe --version
      - shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/master.exe dist/nxt-master-windows-amd64.exe
          Copy-Item target/release/agent.exe dist/nxt-agent-windows-amd64.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-amd64
          path: dist/*
          if-no-files-found: error

  release:
    needs: [check, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # créer la release
      id-token: write # attestation de provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          # Uniquement les binaires (jamais les condensats d'images ni d'éventuels artefacts annexes).
          pattern: "{linux,windows}-*"
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          sha256sum nxt-* > SHA256SUMS
          cat SHA256SUMS
      - name: Attestation de provenance (qui a construit quoi, à partir de quel commit)
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/nxt-*
      - name: Release GitHub
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          FLAGS=""
          [ "$PRERELEASE" = true ] && FLAGS="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $FLAGS
      - name: Répétition, rien n'est publié
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-rehearsal
          path: dist/*

  sign:
    # SIGNATURE du manifeste de release (étape 2 des mises à jour automatiques ; cf. docs/decisions/0026). Seulement pour une
    # vraie publication. L'environnement `release` (GitHub) exige l'approbation d'un relecteur et n'est accessible qu'aux
    # étiquettes `v*` : c'est lui qui protège la clé. AVANT d'approuver : relire `git diff <ancien tag>..<tag> -- .github/`.
    # Les deux secrets ne sont donnés qu'à l'étape « Signature » (jamais à la compilation ni aux autres étapes).
    if: github.event_name == 'push' || (inputs.publish && github.ref_type == 'tag')
    needs: [check, release]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # ajouter manifest.json et manifest.json.sig à la release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: "{linux,windows}-*"
          merge-multiple: true
      - name: Outil de release (aucun accès au secret)
        run: cargo build --release --locked -p release-tool
      - name: Manifeste (empreintes des binaires de CETTE exécution)
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: ./target/release/release-tool manifest --dist dist --version "$VERSION" --out dist/manifest.json
      - name: Signature (SEULE étape qui voit le secret)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_PASSPHRASE }}
        run: |
          set -eu
          umask 077
          KEY="$RUNNER_TEMP/release.key"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$KEY"
          openssl pkeyutl -sign -inkey "$KEY" -passin env:RELEASE_SIGNING_PASSPHRASE -rawin \
            -in dist/manifest.json -out dist/manifest.json.sig
      - name: Vérification comme l'agent (clés COMPILÉES) ; échoue si le secret n'est pas la clé publiée
        run: ./target/release/release-tool verify --manifest dist/manifest.json --sig dist/manifest.json.sig --dist dist
      - name: Ajout à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/manifest.json dist/manifest.json.sig --repo "$GITHUB_REPOSITORY"

  sign-rehearsal:
    # Répétition (rien n'est publié) : TOUTE la chaîne avec une clé jetable, sans aucun secret. Prouve à chaque répétition
    # que OpenSSL (signature) et le code de l'agent (vérification) s'entendent, et que les clés compilées refusent une
    # signature qui n'est pas la leur.
    if: ${{ !(github.event_name == 'push' || (inputs.publish && github.ref_type == 'tag')) }}
    needs: [check, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: "{linux,windows}-*"
          merge-multiple: true
      - run: cargo build --release --locked -p release-tool
      - name: Clé jetable, manifeste, signature
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -eu
          openssl genpkey -algorithm ED25519 -aes-256-cbc -pass pass:repetition -out "$RUNNER_TEMP/k.key"
          openssl pkey -in "$RUNNER_TEMP/k.key" -passin pass:repetition -pubout -outform DER > "$RUNNER_TEMP/pub.der"
          PUB="$(tail -c 32 "$RUNNER_TEMP/pub.der" | od -An -tx1 | tr -d ' \n')"
          KEYID="$(sha256sum "$RUNNER_TEMP/pub.der" | cut -c1-8)"
          ./target/release/release-tool manifest --dist dist --version "$VERSION" --key-id "$KEYID" --out dist/manifest.json
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/k.key" -passin pass:repetition -rawin -in dist/manifest.json -out dist/manifest.json.sig
          ./target/release/release-tool verify --manifest dist/manifest.json --sig dist/manifest.json.sig --dist dist --trusted-key "$PUB"
          # Les clés COMPILÉES doivent refuser cette signature (sinon la vérification ne protégerait rien).
          if ./target/release/release-tool verify --manifest dist/manifest.json --sig dist/manifest.json.sig --dist dist; then
            echo "::error::les clés compilées ont accepté une signature jetable"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-rehearsal
          path: |
            dist/manifest.json
            dist/manifest.json.sig

  manifests:
    # Un tag unique par image, qui désigne la bonne architecture selon la machine (amd64 ou arm64).
    if: github.event_name == 'push' || (inputs.publish && github.ref_type == 'tag')
    needs: [check, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Manifestes multi-architecture
        env:
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          for t in master agent; do
            IMG="ghcr.io/$OWNER/nxt-$t"
            TAGS="-t $IMG:$VERSION"
            [ "$PRERELEASE" = false ] && TAGS="$TAGS -t $IMG:latest"
            docker buildx imagetools create $TAGS \
              "$IMG@$(cat /tmp/digests/$t-amd64)" "$IMG@$(cat /tmp/digests/$t-arm64)"
            docker buildx imagetools inspect "$IMG:$VERSION"
          done
