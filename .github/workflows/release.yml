name: release
# Publication : binaires statiques (Linux amd64 et arm64, Windows), SHA256SUMS + attestation de provenance, et images
# Docker multi-architecture sur GHCR. Déclenchée par une étiquette `vX.Y.Z` (qui doit être la version de Cargo.toml).
# `workflow_dispatch` (publish = false) construit tout SANS rien publier : c'est la répétition générale.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier réellement (release GitHub + images GHCR) ; faux = répétition sans publication"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
  # Les actions Docker déposent sinon un artefact « *.dockerbuild » (journal de construction) qui n'est pas un zip et fait
  # échouer un `download-artifact` sans filtre.
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: v
        name: L'étiquette doit être la version du workspace
        run: |
          V="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)"
          [ -n "$V" ] || { echo "::error::version introuvable dans Cargo.toml"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::l'étiquette $GITHUB_REF_NAME ne correspond pas à la version $V de Cargo.toml"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          case "$V" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  linux:
    # Par architecture, NATIVEMENT : UNE seule compilation (Dockerfile, étape `build`), dont on tire les binaires statiques
    # puis les deux images (master, agent). Les trois constructions partagent le cache de BuildKit de ce job : les images
    # ne recompilent rien.
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Binaires (compilation unique)
        run: |
          docker buildx build --target artifacts --output type=local,dest=out             --cache-from type=gha,scope=build-${{ matrix.arch }} --cache-to type=gha,scope=build-${{ matrix.arch }},mode=max .
      - name: Les binaires sont STATIQUES (aucune dépendance dynamique)
        run: |
          for b in nxt-master nxt-agent; do
            file "out/$b" | grep -Eq "statically linked|static-pie linked" || { echo "::error::$b n'est pas statique"; exit 1; }
            ! ldd "out/$b" 2>/dev/null | grep -q "=>" || { echo "::error::$b a des dépendances dynamiques"; ldd "out/$b"; exit 1; }
          done
      - name: Les binaires s'exécutent
        run: ./out/nxt-agent --version && ./out/nxt-master --version
      - run: |
          mkdir dist
          cp out/nxt-master "dist/nxt-master-linux-${{ matrix.arch }}"
          cp out/nxt-agent "dist/nxt-agent-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      # Images minimales (scratch, non-root). Les couches de compilation viennent du cache de l'étape précédente.
      - name: Propriétaire en minuscules (GHCR l'exige)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: master
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: master
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
          outputs: type=image,name=ghcr.io/${{ env.OWNER }}/nxt-master,push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH == 'true' }}
      - id: agent
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: agent
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
          outputs: type=image,name=ghcr.io/${{ env.OWNER }}/nxt-agent,push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH == 'true' }}
      - name: Condensats des images
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.master.outputs.digest }}" > "/tmp/digests/master-${{ matrix.arch }}"
          echo "${{ steps.agent.outputs.digest }}" > "/tmp/digests/agent-${{ matrix.arch }}"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - run: cd ui && npm ci && npm run build
      - run: cargo build --release --locked -p master -p agent
      - name: Les binaires s'exécutent
        run: ./target/release/agent.exe --version
      - shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/master.exe dist/nxt-master-windows-amd64.exe
          Copy-Item target/release/agent.exe dist/nxt-agent-windows-amd64.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-amd64
          path: dist/*
          if-no-files-found: error

  release:
    needs: [check, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # créer la release
      id-token: write # attestation de provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          # Uniquement les binaires (jamais les condensats d'images ni d'éventuels artefacts annexes).
          pattern: "{linux,windows}-*"
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          sha256sum nxt-* > SHA256SUMS
          cat SHA256SUMS
      - name: Attestation de provenance (qui a construit quoi, à partir de quel commit)
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/nxt-*
      - name: Release GitHub
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          FLAGS=""
          [ "$PRERELEASE" = true ] && FLAGS="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $FLAGS
      - name: Répétition, rien n'est publié
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-rehearsal
          path: dist/*

  manifests:
    # Un tag unique par image, qui désigne la bonne architecture selon la machine (amd64 ou arm64).
    if: github.event_name == 'push' || inputs.publish
    needs: [check, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Manifestes multi-architecture
        env:
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          for t in master agent; do
            IMG="ghcr.io/$OWNER/nxt-$t"
            TAGS="-t $IMG:$VERSION"
            [ "$PRERELEASE" = false ] && TAGS="$TAGS -t $IMG:latest"
            docker buildx imagetools create $TAGS \
              "$IMG@$(cat /tmp/digests/$t-amd64)" "$IMG@$(cat /tmp/digests/$t-arm64)"
            docker buildx imagetools inspect "$IMG:$VERSION"
          done
