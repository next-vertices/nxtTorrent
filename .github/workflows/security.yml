name: security
# Surveillance des failles connues dans les dépendances. Hebdomadaire, à chaque changement des dépendances, et à la demande.
on:
  push:
    branches: [main]
    paths: ["Cargo.lock", "**/Cargo.toml", "ui/package-lock.json", "ui/package.json"]
  pull_request:
    paths: ["Cargo.lock", "**/Cargo.toml", "ui/package-lock.json", "ui/package.json"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    # Base d'avis RustSec : échoue si une dépendance a une faille connue.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
  ui:
    # Dépendances de l'interface : seules celles livrées (hors outils de développement) peuvent bloquer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: cd ui && npm ci --ignore-scripts
      - run: cd ui && npm audit --omit=dev --audit-level=high
      # Informatif : les outils de développement (vite, svelte-check…) ne sont pas dans les binaires.
      - run: cd ui && npm audit --audit-level=high || echo "::warning::avis sur des outils de développement (voir le journal)"
  review:
    # Sur une demande de fusion : refuse d'introduire une dépendance avec une faille de gravité élevée.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v4
        with:
          fail-on-severity: high
