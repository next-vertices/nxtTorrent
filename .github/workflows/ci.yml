name: ci
# Un push sur `main` OU une pull request, jamais les deux pour le même commit ; pas sur les étiquettes (le workflow
# `release` a ses propres contrôles, sur un commit déjà validé ici).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un nouveau push annule le run précédent de la même branche (économise des minutes de CI).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Droits minimaux par défaut : lecture du code seulement (aucun job de CI n'écrit dans le dépôt).
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl -p master -p agent
  systemd:
    # Unités systemd exercées pour de vrai (systemd en PID 1 dans un conteneur) : démarrage, isolation,
    # plantage -> redémarrage, arrêt propre sur SIGTERM, appairage agent <-> master.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl -p master -p agent
      - run: |
          mkdir -p dist/linux
          cp target/x86_64-unknown-linux-musl/release/master target/x86_64-unknown-linux-musl/release/agent dist/linux/
      - run: sh deploy/systemd/test/run-in-docker.sh
      - run: sh deploy/systemd/test/install-agent-dryrun.sh   # script d'installation d'agent, dans un conteneur jetable
      - run: sh deploy/systemd/test/install-agent-arch.sh     # choix d'architecture (amd64/arm64), empreintes, refus
  ui:
    # Interface Svelte : contrôle statique (accessibilité, réactivité), construction, puis test de bout en
    # bout dans un vrai navigateur contre un vrai master et un vrai agent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cd ui && npm ci && npm run check && npm run build
      - run: cargo build -p master -p agent && cargo build -p testkit --example mock_qbit
      - run: BROWSER="$(which google-chrome)" node ui/e2e/smoke.mjs
      - run: BROWSER="$(which google-chrome)" node ui/e2e/fleet.mjs   # page Nœuds avec 100 nœuds simulés
      - run: node ui/e2e/explain.mjs   # traduction des messages d'erreur des clients
      - run: BROWSER="$(which google-chrome)" node ui/e2e/create.mjs   # assistant « Créer un torrent »
      - run: BROWSER="$(which google-chrome)" node ui/e2e/xseed.mjs   # cross-seed : une ligne par contenu, page dédiée
      - run: BROWSER="$(which google-chrome)" node ui/e2e/i18n.mjs   # langues complètes, aucun texte français oublié à l'écran
  release-build:
    # Les binaires que publiera `release.yml` se construisent et sont STATIQUES (même chemin que la publication).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: docker buildx build --target artifacts --output type=local,dest=out .
      - run: |
          for b in nxt-master nxt-agent; do
            file "out/$b" | grep -Eq "statically linked|static-pie linked"
            ./out/$b --version
          done
      - name: master-env.sh produit la configuration d'un parc mixte
        run: |
          A=$(printf 'a%.0s' $(seq 64)); B=$(printf 'b%.0s' $(seq 64))
          printf '%s  nxt-agent-linux-amd64\n%s  nxt-agent-linux-arm64\n' "$A" "$B" > SUMS
          sh deploy/release/master-env.sh SUMS https://exemple.org/r | grep -q "amd64=$A,arm64=$B"
  docker:
    # Images minimales : non-root, lecture seule, sans capacité ; healthcheck, appairage, tunnel,
    # plantage -> redémarrage, arrêt propre.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --target master -t nxt-master:dev .
      - run: docker build --target agent -t nxt-agent:dev .
      - run: sh deploy/docker/test.sh
      # Parcours utilisateur complet sur le Compose (master + Transmission + agent), redémarrage compris.
      - run: docker tag nxt-master:dev nxt-master:latest && docker tag nxt-agent:dev nxt-agent:latest && sh deploy/docker/test-compose.sh
  windows:
    # Windows / Windows Server : tests + binaires autonomes (CRT statique, aucun runtime VC++ requis).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --workspace
      - run: cargo build --release -p master -p agent
      # Le runner est Administrateur : cycle de vie RÉEL du service (install, start, listener, stop, uninstall).
      - run: cargo test -p master --test windows_service -- --ignored --nocapture
      - run: cargo test -p agent --test windows_service -- --ignored --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x86_64
          path: |
            target/release/master.exe
            target/release/agent.exe
  real-clients:
    # Conformité des drivers contre de vrais clients torrent (conteneurs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: docker compose -f testkit/docker/compose.yml up -d
      - name: Attente des interfaces
        run: |
          for p in 18080 19092 18112 18081; do
            timeout 120 sh -c "until curl -s -o /dev/null http://127.0.0.1:$p/; do sleep 2; done"
          done
          sleep 10
      - name: Mot de passe temporaire de qBittorrent (généré au démarrage, lu dans ses journaux)
        run: |
          PW=""
          for i in $(seq 1 30); do
            PW="$(docker compose -f testkit/docker/compose.yml logs qbittorrent 2>&1 | grep -o 'provided for this session: .*' | tail -n 1 | sed 's/^[^:]*: //' | tr -d '\r')"
            [ -n "$PW" ] && break
            sleep 2
          done
          [ -n "$PW" ] || { echo "::error::mot de passe temporaire de qBittorrent introuvable dans ses journaux"; docker compose -f testkit/docker/compose.yml logs qbittorrent; exit 1; }
          echo "::add-mask::$PW"
          echo "QBIT_PASS=$PW" >> "$GITHUB_ENV"
      - run: cargo test -p agent --test real_clients -- --ignored --test-threads=1
      - if: always()
        run: docker compose -f testkit/docker/compose.yml down -v
