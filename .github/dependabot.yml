# Mises à jour automatiques : les dépendances Rust et npm, les actions GitHub (épinglées par commit : Dependabot met à jour
# l'empreinte ET le commentaire de version) et l'image de base du Dockerfile. Chaque mise à jour est une demande de fusion
# que la CI vérifie avant que vous la fusionniez ; rien n'est appliqué sans vous.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      # Les correctifs et mises à jour mineures sont regroupés ; les changements majeurs restent séparés.
      rust-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      ui-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
