# Clients torrent RÉELS pour les tests de drivers (tous liés à 127.0.0.1).
#   docker compose -f testkit/docker/compose.yml up -d
# Les tests ignorés (`cargo test -- --ignored`) lisent les ports/identifiants ci-dessous.
name: nxt-torrent-clients
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    # Le port de l'interface est le MÊME des deux côtés : qBittorrent refuse un en-tête Host dont le port diffère du sien
    # (réponse « Unauthorized », vue comme une erreur d'authentification).
    environment: { PUID: "1000", PGID: "1000", TZ: "UTC", WEBUI_PORT: "18080" }
    ports: ["127.0.0.1:18080:18080"]
    # Pas de mot de passe fixe : l'image en génère un temporaire à chaque premier démarrage, lisible dans ses journaux :
    #   docker compose -f testkit/docker/compose.yml logs qbittorrent | grep "provided for this session"
    # puis `QBIT_PASS=<ce mot de passe> cargo test -p agent --test real_clients -- --ignored`.
    # (Un dossier de configuration local peut le fixer : il n'est jamais versionné.)
    volumes: ["./qbittorrent-config:/config"]
    tmpfs: ["/downloads"]
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    environment: { PUID: "1000", PGID: "1000", TZ: "UTC", USER: admin, PASS: adminadmin }
    ports: ["127.0.0.1:19092:9091"]
    tmpfs: ["/downloads"]
  deluge:
    image: lscr.io/linuxserver/deluge:latest
    environment: { PUID: "1000", PGID: "1000", TZ: "UTC" }
    ports: ["127.0.0.1:18112:8112"]
    tmpfs: ["/downloads"]
  rutorrent:
    image: crazymax/rtorrent-rutorrent:latest
    environment: { PUID: "1000", PGID: "1000", TZ: "UTC" }
    ports: ["127.0.0.1:18081:8080"]
    tmpfs: ["/downloads"]
