[package]
name = "testkit"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
axum = { version = "0.8", features = ["multipart", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xmlrpc-lite = { path = "../xmlrpc-lite" }
proto = { path = "../proto" }
ring = "0.17"
data-encoding = "2"
sha1 = "0.11"
