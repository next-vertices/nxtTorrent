[package]
name = "master"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
name = "master"
path = "src/lib.rs"

[[bin]]
name = "master"
path = "src/main.rs"

[dependencies]
proto = { path = "../proto" }
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport", "tls-ring", "router"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
rusqlite = { version = "0.43", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
time = "0.3"
data-encoding = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws"] }
argon2 = "0.5"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
sha2 = "0.10"
ring = "0.17"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
winsvc = { path = "../winsvc" }

[dev-dependencies]
agent = { path = "../agent" }
tempfile = "3"
tokio-tungstenite = "0.29"
futures-util = "0.3"
testkit = { path = "../testkit" }
